name: Dependabot Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Dependency Update
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.actor == 'dependabot[bot]'

    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 取得 Dependabot 更新資訊
      - name: Fetch Dependabot Metadata
        id: metadata
        if: github.event_name == 'pull_request'
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Node.js / pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Rust
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Tauri Linux dependencies
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # Frontend dependencies
      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      # Frontend validation
      - name: Run Oxlint
        run: pnpm lint

      - name: Build Frontend
        run: pnpm build

      # Backend validation
      - name: Cargo Check
        working-directory: src-tauri
        run: cargo check --workspace --all-targets

      - name: Cargo Tests
        working-directory: src-tauri
        run: cargo test --workspace

      # Generate validation summary
      - name: Generate Summary
        if: always()
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Dependabot Validation"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Ecosystem | ${PACKAGE_ECOSYSTEM:-Manual / Unknown} |"
            echo "| Update Type | ${UPDATE_TYPE:-N/A} |"
            echo "| Validation | ${JOB_STATUS} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
