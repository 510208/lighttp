name: "Publish App"

on:
  push:
    tags:
      - "v*" # 當推送以 v 開頭的標籤（如 v1.0.0）時觸發
      - "[0-9]*.[0-9]*.[0-9]" # 當推送符合版本號格式的標籤（如 1.0.0）時觸發
  workflow_dispatch:
    inputs:
      build_macos:
        description: "建置 macOS 版本"
        required: true
        type: boolean
        default: true
      build_ubuntu:
        description: "建置 Ubuntu (Linux) 版本"
        required: true
        type: boolean
        default: true
      build_windows:
        description: "建置 Windows 版本"
        required: true
        type: boolean
        default: true

jobs:
  # 動態計算需要建置的作業系統
  matrix-generator:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          # 1. 檢查是否為手動觸發，如果不是（例如推 Tag 自動觸發），則預設全開
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            INCLUDE_MACOS=true
            INCLUDE_UBUNTU=true
            INCLUDE_WINDOWS=true
          else
            INCLUDE_MACOS=${{ inputs.build_macos }}
            INCLUDE_UBUNTU=${{ inputs.build_ubuntu }}
            INCLUDE_WINDOWS=${{ inputs.build_windows }}
          fi

          # 2. 根據布爾值動態組合 JSON 陣列
          JSON_ITEMS=""
          if [ "$INCLUDE_MACOS" = "true" ]; then
            JSON_ITEMS="$JSON_ITEMS{\"platform\":\"macos-latest\",\"node_options\":\"--max-old-space-size=6144\"},"
          fi
          if [ "$INCLUDE_UBUNTU" = "true" ]; then
            JSON_ITEMS="$JSON_ITEMS{\"platform\":\"ubuntu-22.04\",\"node_options\":\"\"},"
          fi
          if [ "$INCLUDE_WINDOWS" = "true" ]; then
            JSON_ITEMS="$JSON_ITEMS{\"platform\":\"windows-latest\",\"node_options\":\"\"},"
          fi

          # 3. 移除末尾逗號並加上外層包裝
          JSON_ITEMS=$(echo "$JSON_ITEMS" | sed 's/,$//')

          # 防呆機制：若手動觸發時全部都沒勾選，預設至少塞入一個空值防止 workflow 報錯，並退出
          if [ -z "$JSON_ITEMS" ]; then
            echo "❌ 錯誤：你沒有勾選任何作業系統！"
            exit 1
          fi

          MATRIX_JSON="{\"include\":[$JSON_ITEMS]}"

          echo "最終建置矩陣: $MATRIX_JSON"
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  # Tauri 建置
  publish-tauri:
    needs: matrix-generator
    permissions:
      contents: write # 必須：允許 action 創建 release 和上傳附件

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-generator.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # 完整拉取歷史

      - name: Check if version is bumped
        id: get-version
        shell: bash
        run: |
          # 1. 取得當前專案設定檔（tauri.conf.json）中的版本號
          CURRENT_VERSION=$(grep '"version":' src-tauri/tauri.conf.json | head -1 | awk -F: '{ print $2 }' | sed 's/[", ]//g')
          TARGET_TAG="app-v$CURRENT_VERSION"

          # 將純版本號存入環境變數供後面重新命名步驟使用
          echo "VERSION=v$CURRENT_VERSION" >> $GITHUB_OUTPUT

          echo "Checking if $TARGET_TAG already exists in global remote history..."

          # 2. 直接對 GitHub 遠端庫查詢全部 Tag 列表
          IF_EXISTS=$(git ls-remote --tags origin "refs/tags/${TARGET_TAG}" | awk '{print $2}')

          if [ ! -z "$IF_EXISTS" ]; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "❌ 嚴格阻斷：版本衝突！"
            echo "目標 Tag [ $TARGET_TAG ] 在此專案的 GitHub 歷史紀錄中早就已經存在！"
            echo "請先至專案內修改 tauri.conf.json 的 \"version\"（例如升級至 0.2.1 或 0.3.0）再行觸發。"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          else
            echo "✅ 安全放行：$TARGET_TAG 是一個全未出現過的全新版本，開始建構！"
          fi

      - name: Setup node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        run: pnpm install

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build the app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          NODE_OPTIONS: ${{ matrix.node_options }}
        with:
          tagName: app-v__VERSION__
          releaseName: "LigHTTP v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
