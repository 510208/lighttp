[package]
name = "lighttp"
version = "0.7.0"
edition = "2021"
description = "A lightweight Postman-like tool written in Rust"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lighttp_lib"

[dependencies]
base64 = "0.23.1"
cookie = "0.18"
cookie_store = { version = "0.22", default-features = false, features = ["serde"] }
futures-util = "0.3.34"
log = "0.4.29"
reqwest = { version = "0.13.3", features = ["cookies", "form", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-pinia = "5.0.2"
tauri-plugin-process = "2.3.1"
tauri-store = "1.2.2"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
time = "0.3"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-cli = "2.4.1"
tauri-plugin-updater = "2.11.0"
